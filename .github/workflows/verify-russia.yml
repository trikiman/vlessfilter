# verify-russia.yml — bridge-verify candidate keys via RU SOCKS proxy
#
# How this works:
# 1. Pick alive RU keys from subs/RU.txt as bridge candidates.
# 2. Start xray-knife proxy inbound with the best bridge → local SOCKS5.
# 3. Use proxychains4 to route xray-knife http tests through the bridge.
#    Test traffic egresses via Russian datacenter IP, approximating
#    what users on Russian residential IPs experience.
# 4. Keys that pass the bridge test → subs/verified-russia.txt.
# 5. Commit + push.
#
# Runs every 30 min (much faster than the full refresh.yml every 4h).
# Total cycle ~3-5 min: bridge boot + ~120 candidate tests at ~2s each.
name: verify-russia

on:
  schedule:
    # Every 30 min
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: 'Max candidates to probe (0 = whole pool)'
        required: false
        default: '1500'
      target_keys:
        description: 'Stop once this many keys verify'
        required: false
        default: '150'
      probe_budget_sec:
        description: 'Wall-clock budget for the probe sweep'
        required: false
        default: '900'
      ss_probe_quota:
        description: 'Shadowsocks candidates probed up front (0 = keep SS last, i.e. never measured)'
        required: false
        default: '40'
      parallel:
        description: 'Concurrent probes through the bridge'
        required: false
        default: '12'
  workflow_run:
    # Also run immediately after refresh.yml completes (so freshly
    # discovered keys get bridge-verified ASAP).
    workflows: ['refresh']
    types: [completed]

concurrency:
  group: verify-russia
  cancel-in-progress: false

jobs:
  bridge-verify:
    runs-on: ubuntu-latest
    # Must stay under the 30-min cron interval: bridge boot + probe budget
    # (default 15 min) + commit/push, with headroom.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install xray-knife + proxychains4
        run: |
          # Pinned to match refresh.yml — see the rationale there. v9@latest
          # (v9.12.1) panics on trojan configs via xray-core's splithttp, which
          # would silently drop trojan from the RU candidate pool too.
          go install github.com/lilendian0x00/xray-knife/v10@v10.1.1
          echo "$HOME/go/bin" >> $GITHUB_PATH
          sudo apt-get install -y proxychains4
          xray-knife --version || true

      - name: Pick + start RU bridge (with fallback)
        id: pick-bridge
        env:
          RU_BRIDGE_FALLBACK: ${{ secrets.RU_BRIDGE_FALLBACK }}
        run: |
          set +e
          export PATH=$PATH:$HOME/go/bin

          BRIDGE_FILE="subs/RU.txt"
          declare -a candidates

          if [ -f "$BRIDGE_FILE" ]; then
            declare -A seen
            while IFS= read -r line; do
              [[ "$line" =~ ^(vless|trojan|ss|vmess):// ]] || continue
              hp=$(echo "$line" | grep -oE '@[^:?/#]+:[0-9]+' | head -1)
              [ -z "$hp" ] && continue
              if [ -z "${seen[$hp]:-}" ]; then
                seen[$hp]=1
                candidates+=("$line")
              fi
            done < "$BRIDGE_FILE"
          fi

          if [ -n "$RU_BRIDGE_FALLBACK" ]; then
            hp=$(echo "$RU_BRIDGE_FALLBACK" | grep -oE '@[^:?/#]+:[0-9]+' | head -1)
            if [ -n "$hp" ] && [ -z "${seen[$hp]:-}" ]; then
              candidates+=("$RU_BRIDGE_FALLBACK")
              echo "Added fallback bridge: $hp"
            fi
          fi

          # Fetch igareck's pre-validated Reality+Vision RU whitelist as additional
          # bridge candidates. These are auto-curated by igareck's in-RU probe so
          # they're way fresher than our subs/RU.txt cycle.
          for f in Vless-Reality-White-Lists-Rus-Mobile.txt Vless-Reality-White-Lists-Rus-Mobile-2.txt; do
            curl -sSL --max-time 15 "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/$f" 2>/dev/null \
              | grep -E '^vless://.*security=reality' | head -10 > /tmp/igareck-bridges.txt 2>/dev/null || true
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              hp=$(echo "$line" | grep -oE '@[^:?/#]+:[0-9]+' | head -1)
              [ -z "$hp" ] && continue
              if [ -z "${seen[$hp]:-}" ]; then
                seen[$hp]=1
                candidates+=("$line")
              fi
            done < /tmp/igareck-bridges.txt
          done
          echo "After igareck bridge add: ${#candidates[@]} candidates"

          if [ ${#candidates[@]} -eq 0 ]; then
            echo "::warning::no bridge candidates"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Have ${#candidates[@]} unique bridge candidates"

          # Try each candidate: liveness probe → start as SOCKS → verify SOCKS works.
          # Move to next on any failure. Tracks BRIDGE_OK=1 once we find a working one.
          BRIDGE_OK=0
          for c in "${candidates[@]}"; do
            host=$(echo "$c" | grep -oE '@[^:?/#]+:[0-9]+' | head -1 | tr -d '@')
            echo "=== Trying bridge: $host ==="

            # 1. Quick liveness probe (transient connection)
            out=$(timeout 12 xray-knife http -c "$c" -u "https://www.cloudflare.com/cdn-cgi/trace" -d 6000 -b 2>&1)
            if ! echo "$out" | grep -q "✅"; then
              echo "  liveness FAIL"
              continue
            fi
            echo "  liveness PASS"

            # 2. Start as long-running SOCKS5 inbound
            pkill -f 'xray-knife proxy inbound' 2>/dev/null || true
            sleep 1
            nohup xray-knife proxy inbound -c "$c" -p 19999 -a 127.0.0.1 > /tmp/bridge.log 2>&1 &
            echo $! > /tmp/bridge.pid
            sleep 5

            if ! kill -0 $(cat /tmp/bridge.pid) 2>/dev/null; then
              echo "  proxy-inbound process died:"
              tail -10 /tmp/bridge.log | sed 's/^/    /'
              continue
            fi

            USER=$(grep -oE 'Username:\s*\S+' /tmp/bridge.log | head -1 | awk '{print $2}')
            PASS=$(grep -oE 'Password:\s*\S+' /tmp/bridge.log | head -1 | awk '{print $2}')
            if [ -z "$USER" ] || [ -z "$PASS" ]; then
              echo "  could not read SOCKS auth from log"
              kill $(cat /tmp/bridge.pid) 2>/dev/null
              continue
            fi

            # 3. Verify SOCKS actually proxies (curl through it to ipify)
            printf 'strict_chain\nproxy_dns\ntcp_read_time_out 15000\ntcp_connect_time_out 8000\n[ProxyList]\nsocks5 127.0.0.1 19999 %s %s\n' "$USER" "$PASS" > /tmp/pc.conf

            EXIT_IP=$(timeout 12 proxychains4 -f /tmp/pc.conf curl -sSL --max-time 10 https://api.ipify.org 2>/dev/null)
            if [ -z "$EXIT_IP" ]; then
              echo "  SOCKS proxy not actually proxying (ipify timeout)"
              kill $(cat /tmp/bridge.pid) 2>/dev/null
              continue
            fi

            echo "  SOCKS works! Exit IP: $EXIT_IP"
            echo "$c" > /tmp/ru-bridge.txt
            BRIDGE_OK=1
            break
          done

          if [ $BRIDGE_OK -eq 0 ]; then
            echo "::warning::all ${#candidates[@]} bridge candidates failed"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Bridge-verify candidates
        if: steps.pick-bridge.outputs.skip != 'true'
        run: |
          export PATH=$PATH:$HOME/go/bin
          set +e

          # Candidate pool: subs/all.txt first (already curated, so the best
          # keys are probed first), then everything else that tested alive in
          # all-results.csv.
          #
          # subs/all.txt alone is capped at 3-per-country upstream, which left
          # this job choosing from ~115 endpoints while thousands sat measured
          # and unused. Dedup below keeps first-seen, so the curated keys still
          # win their slots — the CSV only extends the tail.
          if [ ! -f subs/all.txt ]; then
            echo "::error::no subs/all.txt"
            exit 1
          fi

          # Shadowsocks was excluded here on the assumption that TSPU blocks
          # AEAD outright. A 2026-07-26 v2rayN run from the operator's actual
          # residential connection returned 18 alive keys that were 100% SS,
          # with zero trojan/vless surviving — the exact inverse of the tier
          # model. The assumption is now in doubt, so SS is probed at lowest
          # priority: it can never displace a better-tiered key, but its real
          # pass rate lands in the reliability history instead of staying
          # unmeasured. Re-settle the tier order from that data, not from this
          # comment.
          # The trailing 4 CSV columns are LatencyMs,SpeedMbps,Country,Score;
          # a link may itself contain commas (and is then CSV-quoted), so the
          # link is rebuilt from every field except those last 4.
          cat > /tmp/csvlinks.awk <<'AWK'
          NR == 1 { next }
          NF < 5 { next }
          $(NF-3) + 0 <= 0 { next }
          {
            link = $1
            for (i = 2; i <= NF-4; i++) link = link "," $i
            if (link ~ /^".*"$/) {
              link = substr(link, 2, length(link)-2)
              gsub(/""/, "\"", link)
            }
            if (link ~ /^(vless|vmess|trojan|ss):\/\//) print link
          }
          AWK
          {
            grep -E "^(vless|vmess|trojan|ss)://" subs/all.txt
            [ -f all-results.csv ] && awk -F',' -f /tmp/csvlinks.awk all-results.csv
          } > /tmp/raw-pool.txt
          mapfile -t raw_lines < /tmp/raw-pool.txt
          echo "Raw pool: ${#raw_lines[@]} lines (subs/all.txt + all-results.csv)"

          # NOTE: we deliberately do NOT prepend igareck's Reality whitelist to
          # the candidate pool. Those are Reality keys that pass the RU datacenter
          # bridge but FAIL the user's RU residential network (2026-05-31 test:
          # 1/15 alive). igareck's list is still used as a BRIDGE source (the
          # bridge runs on a datacenter where Reality works fine).

          # Dedup by host:port + score by protocol resilience.
          # Per 2026 community evidence (igareck, fexyn, ntc.party):
          #   Trojan TLS/TCP              → EMPIRICALLY BEST on user's Iskratelecom
          #   VLESS Reality (+/- Vision)  → mixed: passes RU datacenter, often
          #                                 BLOCKED on RU residential (TSPU). The
          #                                 bridge can't detect this gap.
          #   VLESS over WS+TLS / xhttp   → medium
          #   plain VLESS TCP / vmess     → low
          #   Shadowsocks AEAD            → blocked, EXCLUDED
          #
          # NOTE: 2026-05-31 — user residential v2rayN test showed Reality+Vision
          # 1/15 alive but Trojan-TLS ~70% alive. Flipped tier order to match
          # actual residential behavior over global research consensus.
          declare -A seen_hp
          declare -a tier_a tier_b tier_c tier_d tier_e
          # Endpoint extraction is a bash regex, not `echo | grep`: this loop
          # now walks thousands of lines, and two subprocess spawns per line
          # cost more wall-clock than the probing does.
          no_endpoint=0
          for line in "${raw_lines[@]}"; do
            if [[ "$line" =~ @([^:?/#]+):([0-9]+) ]]; then
              hp="${BASH_REMATCH[1]}:${BASH_REMATCH[2]}"
            else
              # vmess:// hides add/port inside a base64 JSON body, so it never
              # matches and is dropped here — it has never actually reached
              # this pool despite tier D claiming to cover it. Counted rather
              # than silently skipped; decoding belongs in the Go selector.
              no_endpoint=$((no_endpoint + 1))
              continue
            fi
            [ -n "${seen_hp[$hp]:-}" ] && continue
            seen_hp[$hp]=1

            # Tier A: Trojan over TLS (the empirically-best on user's RU residential)
            if [[ "$line" == trojan://*"security=tls"* ]] || \
               [[ "$line" == trojan://* && "$line" != *"type=ws"* && "$line" != *"security=reality"* ]]; then
              tier_a+=("$line")
              continue
            fi
            # Tier B: VLESS Reality (datacenter-friendly; some residential pass)
            if [[ "$line" == vless://*"security=reality"* ]]; then
              tier_b+=("$line")
              continue
            fi
            # Tier C: VLESS/Trojan WS+TLS, xhttp (CDN-fronted)
            if [[ "$line" == *"type=ws"* && "$line" == *"security=tls"* ]] || \
               [[ "$line" == *"type=xhttp"* ]]; then
              tier_c+=("$line")
              continue
            fi
            # Tier E: Shadowsocks — probed last, purely to measure it.
            if [[ "$line" == ss://* ]]; then
              tier_e+=("$line")
              continue
            fi
            # Tier D: everything else (plain VLESS TCP, vmess)
            tier_d+=("$line")
          done

          # Interleave A and B so output has BOTH trojan and reality (don't let
          # one protocol fill every slot — protocol diversity is a hedge, since
          # residential behavior shifts). Then C, then D.
          declare -a cands
          max_ab=$(( ${#tier_a[@]} > ${#tier_b[@]} ? ${#tier_a[@]} : ${#tier_b[@]} ))
          for ((i=0; i<max_ab; i++)); do
            [ "$i" -lt "${#tier_a[@]}" ] && cands+=("${tier_a[$i]}")
            [ "$i" -lt "${#tier_b[@]}" ] && cands+=("${tier_b[$i]}")
          done
          for line in "${tier_c[@]}"; do cands+=("$line"); done
          for line in "${tier_d[@]}"; do cands+=("$line"); done

          # Tier E (Shadowsocks) is the open question this job is supposed to
          # settle, but appending it last made it unmeasurable: it started at
          # index ~502 of 565 while the sweep exits at target_keys (150) passes,
          # so it was never reached. Its bridge pass rate is 0/0, not 0/63 — and
          # "SS is TSPU-blocked" has never actually been measured here. The only
          # bridge data that exists (2026-05-29..31, before SS was dropped from
          # the pool) had SS passing in 25/25 runs taking 36-56% of slots.
          #
          # Reserve a slot quota at the FRONT for tier E so every run measures
          # it, without letting it displace the tiers that currently work. The
          # quota is small and capped by what tier E actually holds.
          SS_PROBE_QUOTA="${{ github.event.inputs.ss_probe_quota || '40' }}"
          declare -a ss_head=() ss_tail=()
          # Split tier E unconditionally: with quota 0 everything lands in the
          # tail, which reproduces the old SS-last order. Guarding this whole
          # block on quota>0 silently DROPPED all of tier E in that case.
          for ((i=0; i<${#tier_e[@]}; i++)); do
            if [ "$i" -lt "$SS_PROBE_QUOTA" ]; then ss_head+=("${tier_e[$i]}")
            else ss_tail+=("${tier_e[$i]}"); fi
          done
          if [ "${#ss_head[@]}" -gt 0 ]; then
            cands=("${ss_head[@]}" "${cands[@]}")
            echo "tier E: probing ${#ss_head[@]} of ${#tier_e[@]} SS candidates up front (quota=$SS_PROBE_QUOTA)"
          fi
          if [ "${#ss_tail[@]}" -gt 0 ]; then
            for line in "${ss_tail[@]}"; do cands+=("$line"); done
          fi
          MAX_CANDIDATES="${{ github.event.inputs.max_candidates || '1500' }}"
          POOL_TOTAL=${#cands[@]}
          if [ "$MAX_CANDIDATES" -gt 0 ] && [ "$POOL_TOTAL" -gt "$MAX_CANDIDATES" ]; then
            cands=("${cands[@]:0:$MAX_CANDIDATES}")
            echo "::notice::pool truncated ${POOL_TOTAL} -> ${MAX_CANDIDATES} candidates ($(( POOL_TOTAL - MAX_CANDIDATES )) never probed)"
          fi

          echo "Pool: ${#cands[@]} unique candidates (of $POOL_TOTAL available)"
          echo "  Tier A (Trojan TLS):      ${#tier_a[@]}"
          echo "  Tier B (VLESS Reality):   ${#tier_b[@]}"
          echo "  Tier C (WS+TLS / xhttp):  ${#tier_c[@]}"
          echo "  Tier D (other):           ${#tier_d[@]}"
          echo "  Tier E (Shadowsocks):     ${#tier_e[@]}  (${#ss_head[@]} probed up front, rest last)"
          if [ "$no_endpoint" -gt 0 ]; then
            echo "::notice::${no_endpoint} configs skipped — no cleartext host:port (vmess base64 bodies)"
          fi

          : > /tmp/verified.txt
          : > /tmp/timings.txt
          : > /tmp/attempted.txt

          TARGET_KEYS="${{ github.event.inputs.target_keys || '150' }}"
          PROBE_BUDGET="${{ github.event.inputs.probe_budget_sec || '900' }}"
          PARALLEL="${{ github.event.inputs.parallel || '12' }}"

          printf '%s\n' "${cands[@]}" > /tmp/cands.txt

          # Probing is network-bound: each candidate spends most of its time
          # waiting on a handshake through the bridge. Running these one at a
          # time meant a 480s budget bought ~40 probes out of a 200 pool, and
          # the sweep stopped at 15 keys — the published count was a ceiling,
          # not a survival rate. Fan out instead, and let the budget bound the
          # sweep rather than the serial probe latency.
          #
          # Stage 1: fast cf-trace gate drops dead keys cheaply.
          # Stage 2: only stage-1 passers pay for ipinfo + google confirmation.
          cat > /tmp/probe.sh <<'PROBE'
          #!/usr/bin/env bash
          c="$1"
          # Cheap early-out so the fan-out stops near the target instead of
          # draining the whole pool. Racy by design: overshoot is harmless.
          if [ "$(wc -l < /tmp/timings.txt)" -ge "$TARGET_KEYS" ]; then exit 0; fi

          # Record the ATTEMPT before probing. Without this the run cannot tell
          # "probed and failed" from "never reached", which is precisely how
          # tier E looked measured for months while being skipped entirely.
          flock /tmp/attempted.lock -c "echo '$c' >> /tmp/attempted.txt" 2>/dev/null || \
            echo "$c" >> /tmp/attempted.txt

          out=$(timeout 8 proxychains4 -f /tmp/pc.conf xray-knife http -c "$c" -u "https://www.cloudflare.com/cdn-cgi/trace" -d 4000 -b 2>&1)
          echo "$out" | grep -q "✅" || exit 0
          d_total=$(echo "$out" | grep -oE "Real Delay:\s*[0-9]+" | awk '{print $NF}')

          for url in "https://ipinfo.io/json" "https://www.google.com/"; do
            out=$(timeout 12 proxychains4 -f /tmp/pc.conf xray-knife http -c "$c" -u "$url" -d 6000 -b 2>&1)
            echo "$out" | grep -q "✅" || exit 0
            d=$(echo "$out" | grep -oE "Real Delay:\s*[0-9]+" | awk '{print $NF}')
            d_total=$((d_total + d))
          done

          avg=$((d_total / 3))
          # Reject high-latency (>2500ms avg through bridge)
          [ "$avg" -le 2500 ] || exit 0
          # flock keeps concurrent appends from interleaving mid-line. Piping
          # into it avoids re-quoting $c, which carries arbitrary #fragment text.
          printf '%s %s\n' "$avg" "$c" | flock /tmp/timings.lock tee -a /tmp/timings.txt > /dev/null
          echo "  [+] avg=${avg}ms  $(echo "$c" | grep -oE '@[^:?/#]+:[0-9]+' | head -1 | tr -d @)"
          PROBE
          chmod +x /tmp/probe.sh
          export TARGET_KEYS

          START=$(date +%s)
          # Budget bounds the sweep; already-written results survive the kill
          # because probe.sh appends incrementally.
          # -r so an empty pool runs nothing instead of one no-arg invocation.
          timeout "$PROBE_BUDGET" xargs -a /tmp/cands.txt -d '\n' -r -P "$PARALLEL" -n 1 /tmp/probe.sh || true
          ELAPSED=$(( $(date +%s) - START ))

          PASS_COUNT=$(wc -l < /tmp/timings.txt)
          cut -d' ' -f2- /tmp/timings.txt > /tmp/verified.txt

          echo
          # ATTEMPTED, not pool size. This line used to print ${#cands[@]},
          # which reads as "we probed 565" when the sweep actually exits at
          # target_keys — so a run that stopped after ~360 still claimed 565.
          # That is what made tier E's 0 passes look like a measured failure
          # rather than never having been reached. probe.sh appends one line per
          # attempt to /tmp/attempted.txt.
          ATTEMPTED=$(wc -l < /tmp/attempted.txt 2>/dev/null || echo 0)
          echo "Result: $PASS_COUNT verified from $ATTEMPTED attempted (pool ${#cands[@]}) in ${ELAPSED}s (parallel=$PARALLEL, target=$TARGET_KEYS)"
          if [ "$ATTEMPTED" -lt "${#cands[@]}" ]; then
            echo "::notice::sweep stopped after $ATTEMPTED of ${#cands[@]} candidates — the remainder were never probed, so their 0 passes mean 'untested', not 'failed'"
          fi
          if [ "$ELAPSED" -ge "$PROBE_BUDGET" ]; then
            echo "::notice::probe sweep hit the ${PROBE_BUDGET}s budget — raise probe_budget_sec or parallel for deeper coverage"
          fi
          if [ "$PASS_COUNT" -ge "$TARGET_KEYS" ]; then
            echo "::notice::hit target of ${TARGET_KEYS} keys — more may have been available; raise target_keys"
          fi

          # Sort by latency, write to subs/verified-russia.txt
          if [ $PASS_COUNT -gt 0 ]; then
            sort -n /tmp/timings.txt | awk '{$1=""; sub(/^ /,""); print}' > subs/verified-russia.txt
            echo "Top 10 fastest:"
            sort -n /tmp/timings.txt | head -10 | awk '{print "  " $1 "ms  " substr($2, 1, 60) "..."}'
          else
            echo "::warning::0 verified through bridge — keeping previous subs/verified-russia.txt"
          fi

      - name: Update reliability history
        if: steps.pick-bridge.outputs.skip != 'true'
        run: |
          # Append per-key per-run results to a JSONL history file.
          # Dashboard reads this to show "alive % over last 24h" per key.
          mkdir -p .readme-data
          HIST=".readme-data/verified-russia-history.jsonl"
          touch "$HIST"

          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_ID="${{ github.run_id }}"

          # Passers first, so the fastest-known-good ordering is unchanged.
          if [ -f /tmp/timings.txt ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              avg=$(echo "$line" | awk '{print $1}')
              uri=$(echo "$line" | awk '{$1=""; sub(/^ /,""); print}')
              hp=$(echo "$uri" | grep -oE '@[^:?/#]+:[0-9]+' | head -1 | tr -d '@')
              proto=$(echo "$uri" | grep -oE '^[a-z]+')
              echo "{\"ts\":\"$NOW\",\"host_port\":\"$hp\",\"proto\":\"$proto\",\"alive\":true,\"delay_ms\":$avg,\"run_id\":\"$RUN_ID\"}" >> "$HIST"
            done < /tmp/timings.txt
          fi

          # FAILURES TOO. Every one of the 19,132 existing records is
          # alive:true, because only passers were ever written — so the file is
          # a survivors log and NO pass rate can be computed from it. That is
          # why "Shadowsocks is TSPU-blocked" reads as measured when SS has a
          # bridge record of 0/0, not 0/63. Attempted-minus-passed gives the
          # denominator, so a protocol's real pass rate becomes derivable.
          if [ -f /tmp/attempted.txt ]; then
            awk '{$1=""; sub(/^ /,""); print}' /tmp/timings.txt 2>/dev/null | sort -u > /tmp/passed_uris.txt
            while IFS= read -r uri; do
              [ -z "$uri" ] && continue
              grep -qxF "$uri" /tmp/passed_uris.txt && continue
              hp=$(echo "$uri" | grep -oE '@[^:?/#]+:[0-9]+' | head -1 | tr -d '@')
              proto=$(echo "$uri" | grep -oE '^[a-z]+')
              echo "{\"ts\":\"$NOW\",\"host_port\":\"$hp\",\"proto\":\"$proto\",\"alive\":false,\"delay_ms\":0,\"run_id\":\"$RUN_ID\"}" >> "$HIST"
            done < /tmp/attempted.txt
          fi

          # Trim history to last 50000 entries (~7 days at 30min × 25 keys)
          if [ $(wc -l < "$HIST") -gt 50000 ]; then
            tail -50000 "$HIST" > "${HIST}.tmp"
            mv "${HIST}.tmp" "$HIST"
          fi

          echo "history size: $(wc -l < $HIST) entries"

      - name: Stop bridge
        if: always() && steps.pick-bridge.outputs.skip != 'true'
        run: |
          if [ -f /tmp/bridge.pid ]; then
            kill $(cat /tmp/bridge.pid) 2>/dev/null || true
          fi

      - name: Commit and push
        if: steps.pick-bridge.outputs.skip != 'true'
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -e
          git config user.name "VlessFilter Bot"
          git config user.email "vf-bot@noreply.github.com"
          git add -f subs/verified-russia.txt .readme-data/verified-russia-history.jsonl 2>/dev/null
          if git diff --cached --quiet; then
            echo "no changes to verified-russia.txt"
            exit 0
          fi
          git commit -m "verify-russia: refresh $(date -u +%Y%m%d-%H%M%S)"
          git fetch origin main
          git rebase origin/main || {
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            git add -f subs/verified-russia.txt
            git commit -m "verify-russia: refresh $(date -u +%Y%m%d-%H%M%S) (forced)" --allow-empty
          }
          if [ -n "$PUSH_TOKEN" ]; then
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          else
            git push origin HEAD:main
          fi
