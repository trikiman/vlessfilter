name: Refresh VLESS keys

# Scheduled regeneration of subs/<CC>.txt + README.md.
# Runs once a day to stay well within free-tier limits.
# No artifact upload, no build cache — keeps storage at $0 for public repo.

on:
  schedule:
    # Once daily at 04:00 UTC (07:00 Moscow).
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Hard cap so a runaway run can't burn excess minutes.
    timeout-minutes: 45
    env:
      VLESSFILTER_QUIET: "1"
      GH_TOKEN: ${{ secrets.VLESSFILTER_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      # Setup Go WITHOUT cache=true — caching the Go build cache pushes
      # repo storage past 500MB free tier, which generated $0.30 of metered
      # storage charges. Public-repo runner minutes themselves are unlimited
      # free; only storage is metered.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -o bin/vlessfilter ./cmd/vlessfilter

      - name: Run pipeline
        run: |
          ./bin/vlessfilter run \
            --sources sources.yaml \
            --out . \
            --threads1 800 \
            --threads2 20 \
            --budget-min 35 \
            --checkpoint-min 5 \
            --git-push \
            --git-branch ${{ github.ref_name }}

      # NOT uploading diagnostics as artifacts — that's what ate the $0.30.
      # Diagnostics live in the repo at all-results.csv + raw/dead.txt
      # (capped to 5000 entries) which costs nothing.
