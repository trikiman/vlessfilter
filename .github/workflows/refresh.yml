# VlessFilter scheduled refresh workflow.
#
# v2.1: matrix parallelism. Each protocol runs on its own ubuntu-latest runner
# in parallel, then a final merge job pushes the union of results to the repo.
#
# Schedule: every 2h (00:00, 02:00, 04:00, ... UTC). On public repos this
# is unlimited / free.
#
# Costs: $0. ubuntu-latest standard runners are free for public repos.
#
# Re-enable after auto-disable: GitHub disables scheduled workflows after
# repeated failures. To re-enable, run a manual `workflow_dispatch` (Actions
# tab > Run workflow), or push any commit to main.
name: refresh

on:
  schedule:
    # Every 2 hours.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      threads1:
        description: 'Stage 1 concurrency override'
        required: false
        default: '3000'
      untested_batch:
        description: 'Untested keys per protocol per stage 1'
        required: false
        default: '240000'
      budget_min:
        description: 'Wall-clock budget per protocol (minutes)'
        required: false
        default: '55'

jobs:
  test:
    name: test (${{ matrix.proto }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    strategy:
      # Don't abort the whole sweep if one protocol crashes.
      fail-fast: false
      matrix:
        proto: [vless, vmess, trojan, ss]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tune kernel
        run: |
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true
          sudo sysctl -w "net.ipv4.ip_local_port_range=1024 65535" || true
          ulimit -n 100000 || true

      - name: Install xray-knife
        run: |
          go install github.com/lilendian0x00/xray-knife/v9@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build vlessfilter
        run: go build -o bin/vlessfilter ./cmd/vlessfilter

      - name: Run pipeline (single protocol)
        env:
          VLESSFILTER_QUIET: '1'
          THREADS1: ${{ github.event.inputs.threads1 || '3000' }}
          BATCH: ${{ github.event.inputs.untested_batch || '240000' }}
          BUDGET: ${{ github.event.inputs.budget_min || '50' }}
        run: |
          ./bin/vlessfilter run \
            --threads1 $THREADS1 \
            --threads2 20 \
            --untested-batch $BATCH \
            --budget-min $BUDGET \
            --checkpoint-min 5 \
            --accuracy-probe \
            --protocols ${{ matrix.proto }}

      - name: Upload protocol output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subs-${{ matrix.proto }}
          path: |
            subs/${{ matrix.proto }}/
            all-results.csv
          retention-days: 7

  merge-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: always()  # publish whatever protocols succeeded even if one failed
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use deploy/PAT for push later. Default GITHUB_TOKEN works for
          # the same repo unless protections require a PAT.
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Download all protocol artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Merge artifacts into subs/ + regenerate top-level all.txt + README
        run: |
          set -e
          mkdir -p subs
          for proto in vless vmess trojan ss; do
            src="artifacts/subs-$proto/${proto}"
            if [ -d "$src" ]; then
              echo "merging $proto"
              mkdir -p "subs/$proto"
              # Country files
              cp -rf "$src"/* "subs/$proto/" 2>/dev/null || true
            else
              echo "no artifact for $proto (job may have failed)"
            fi
          done
          # Back-compat: top-level subs/<CC>.txt mirrors vless
          if [ -d subs/vless ]; then
            for f in subs/vless/*.txt; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              # Skip files that aren't 2-letter country codes
              case "$base" in
                ??.txt) cp "$f" "subs/$base" ;;
                all.txt|rotating.txt) cp "$f" "subs/$base" ;;
              esac
            done
          fi
          # Regenerate top-level all-results.csv if any artifact had one
          for proto in vless vmess trojan ss; do
            csv="artifacts/subs-$proto/all-results.csv"
            if [ -f "$csv" ]; then
              cp -f "$csv" all-results.csv
              break
            fi
          done

      - name: Commit and push
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -e
          git config user.name "VlessFilter Bot"
          git config user.email "vf-bot@noreply.github.com"
          git add -f subs/ all-results.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "results: matrix refresh $(date -u +%Y%m%d-%H%M%S)" || exit 0
          # Pull --rebase to handle the case where humans pushed
          # to main while our matrix jobs were running. Stash any
          # other local changes first to avoid conflict.
          git fetch origin main
          git rebase origin/main || {
            echo "rebase failed (likely conflict in subs/) — taking ours"
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            # Re-apply our generated outputs
            git add -f subs/ all-results.csv 2>/dev/null || true
            git commit -m "results: matrix refresh $(date -u +%Y%m%d-%H%M%S) (forced)" --allow-empty
          }
          if [ -n "$PUSH_TOKEN" ]; then
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          else
            git push origin HEAD:main
          fi
