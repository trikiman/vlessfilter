# VlessFilter scheduled refresh workflow.
#
# v2.1: matrix parallelism. Each protocol runs on its own ubuntu-latest runner
# in parallel, then a final merge job pushes the union of results to the repo.
#
# Schedule: every 2h (00:00, 02:00, 04:00, ... UTC). On public repos this
# is unlimited / free.
#
# Costs: $0. ubuntu-latest standard runners are free for public repos.
#
# Re-enable after auto-disable: GitHub disables scheduled workflows after
# repeated failures. To re-enable, run a manual `workflow_dispatch` (Actions
# tab > Run workflow), or push any commit to main.
name: refresh

on:
  # Re-enabled at 4h interval (less aggressive than original 2h).
  # The verify-russia workflow runs every 30min on its own.
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      threads1:
        description: 'Stage 1 concurrency override'
        required: false
        default: '3000'
      untested_batch:
        description: 'Untested keys per protocol per stage 1'
        required: false
        default: '240000'
      budget_min:
        description: 'Wall-clock budget per protocol (minutes)'
        required: false
        default: '55'

jobs:
  prep-sources:
    # Fetch upstream sources that need conversion (e.g. sub.pai.yt sing-box
    # JSON → URI list), commit to repo so the test jobs read fresh data.
    # Must complete before any test job starts.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build singboxconv
        run: go build -o bin/singboxconv ./cmd/singboxconv

      - name: Convert sub.pai.yt sing-box JSON to URI subscription
        run: |
          mkdir -p dev/sources-fetched
          # 3 attempts with exponential backoff. sub.pai.yt is sometimes
          # slow, sometimes returns partial JSON. Total max wait: 90+120+150
          # = 360s before we give up and keep previous file.
          ok=0
          for attempt in 1 2 3; do
            timeout=$((60 + attempt * 30))
            echo "attempt $attempt with timeout ${timeout}s"
            set +e
            ./bin/singboxconv \
              --url https://sub.pai.yt/singbox \
              --timeout $timeout \
              > dev/sources-fetched/paiyt.txt.tmp
            rc=$?
            set -e
            if [ $rc -eq 0 ] && [ -s dev/sources-fetched/paiyt.txt.tmp ]; then
              # Verify the output looks like URIs (has at least one vless/vmess/trojan/ss URI)
              if grep -qE '^(vless|vmess|trojan|ss)://' dev/sources-fetched/paiyt.txt.tmp; then
                mv dev/sources-fetched/paiyt.txt.tmp dev/sources-fetched/paiyt.txt
                echo "paiyt.txt: $(wc -l < dev/sources-fetched/paiyt.txt) lines (attempt $attempt)"
                ok=1
                break
              fi
            fi
            echo "attempt $attempt failed (rc=$rc); waiting before retry"
            sleep 10
          done
          rm -f dev/sources-fetched/paiyt.txt.tmp
          if [ "$ok" -ne 1 ]; then
            echo "WARN: all 3 paiyt fetch attempts failed; leaving previous file intact"
            git checkout -- dev/sources-fetched/paiyt.txt 2>/dev/null || true
          fi

      - name: Commit prep changes (if any)
        id: commit
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -e
          git config user.name "VlessFilter Bot"
          git config user.email "vf-bot@noreply.github.com"
          git add -f dev/sources-fetched/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "prep: refresh converted sources $(date -u +%Y%m%d-%H%M%S)"
          if [ -n "$PUSH_TOKEN" ]; then
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          else
            git push origin HEAD:main
          fi
          echo "changed=true" >> $GITHUB_OUTPUT

  test:
    needs: prep-sources
    name: test (${{ matrix.proto }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    strategy:
      # Don't abort the whole sweep if one protocol crashes.
      fail-fast: false
      matrix:
        proto: [vless, vmess, trojan, ss]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Tune kernel
        run: |
          sudo sysctl -w net.ipv4.tcp_tw_reuse=1 || true
          sudo sysctl -w "net.ipv4.ip_local_port_range=1024 65535" || true
          ulimit -n 100000 || true

      - name: Install xray-knife
        run: |
          # PINNED. `v9@latest` resolved to v9.12.1, whose bundled xray-core
          # panics with a nil pointer dereference in the splithttp transport
          # while testing trojan configs. That crashed stage 1 at ~35%, the
          # pipeline then saw 0 alive trojan, and the "don't publish empty"
          # guard preserved a stale artifact — so subs/trojan/ silently served
          # 2026-07-17 keys for 26 days while the job still reported success.
          # v10.1.1 completes the same pool cleanly (verified 2026-08-12).
          # Do NOT move this back to @latest: an unpinned engine is how a
          # protocol goes dark without failing a single check.
          go install github.com/lilendian0x00/xray-knife/v10@v10.1.1
          echo "$HOME/go/bin" >> $GITHUB_PATH
          xray-knife --version || true

      - name: Build vlessfilter
        run: go build -o bin/vlessfilter ./cmd/vlessfilter

      - name: Run pipeline (single protocol)
        env:
          VLESSFILTER_QUIET: '1'
          THREADS1: ${{ github.event.inputs.threads1 || '3000' }}
          BATCH: ${{ github.event.inputs.untested_batch || '240000' }}
          BUDGET: ${{ github.event.inputs.budget_min || '50' }}
        run: |
          ./bin/vlessfilter run \
            --threads1 $THREADS1 \
            --threads2 20 \
            --untested-batch $BATCH \
            --budget-min $BUDGET \
            --checkpoint-min 5 \
            --accuracy-probe \
            --protocols ${{ matrix.proto }}

      - name: Upload protocol output as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: subs-${{ matrix.proto }}
          path: |
            subs/${{ matrix.proto }}/
            .readme-data/${{ matrix.proto }}.json
            all-results.csv
          retention-days: 7
          include-hidden-files: true

  merge-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: always()  # publish whatever protocols succeeded even if one failed
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Use deploy/PAT for push later. Default GITHUB_TOKEN works for
          # the same repo unless protections require a PAT.
          token: ${{ secrets.PUSH_TOKEN || github.token }}

      - name: Download all protocol artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/

      - name: Merge artifacts into subs/ + regenerate top-level all.txt + README
        run: |
          set -e
          mkdir -p subs .readme-data
          for proto in vless vmess trojan ss; do
            # actions/upload-artifact preserves the source directory
            # structure inside the artifact. We uploaded `subs/<proto>/`
            # so the download dir is `artifacts/subs-<proto>/subs/<proto>/`.
            src="artifacts/subs-$proto/subs/${proto}"
            if [ -d "$src" ]; then
              echo "merging $proto from $src"
              mkdir -p "subs/$proto"
              cp -rf "$src"/* "subs/$proto/" 2>/dev/null || true
            else
              echo "no artifact for $proto (job may have failed) — looked for $src"
              ls -la artifacts/subs-$proto/ 2>/dev/null | head -10 || true
            fi
            # Copy the JSON sidecar (lives outside subs/ to keep commits clean)
            sidecar="artifacts/subs-$proto/.readme-data/${proto}.json"
            if [ -f "$sidecar" ]; then
              cp -f "$sidecar" ".readme-data/${proto}.json"
            fi
          done

      - name: Setup Go (for regen-readme)
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Regenerate top-level README from per-protocol sidecars
        run: |
          go build -o /tmp/vlessfilter ./cmd/vlessfilter
          # regen-readme now exits non-zero rather than writing a README that
          # omits a protocol which still has published keys. Keeping the
          # previous README is the correct outcome there — a stale-but-honest
          # README beats one that hides live subscription URLs. Surfaced as a
          # ::warning:: so it appears in the Actions summary instead of only in
          # the step log, where the previous bare echo was invisible.
          /tmp/vlessfilter regen-readme --out . || {
            echo "::warning::regen-readme failed — keeping the previous README (see the ::error:: above for which protocol was at risk of being dropped)"
          }

      - name: Build top-level subs/ as union of all 4 protocols
        run: |
          # subs/all.txt — UNION of all 4 protocols' all.txt (every working
          # key regardless of protocol or country). One subscription URL
          # imports the entire pool.
          : > subs/all.txt
          for proto in vless vmess trojan ss; do
            if [ -f "subs/$proto/all.txt" ]; then
              cat "subs/$proto/all.txt" >> subs/all.txt
            fi
          done

          # subs/rotating.txt — UNION of all 4 protocols' rotating.txt.
          : > subs/rotating.txt
          for proto in vless vmess trojan ss; do
            if [ -f "subs/$proto/rotating.txt" ]; then
              cat "subs/$proto/rotating.txt" >> subs/rotating.txt
            fi
          done

          # subs/<CC>.txt — for each country code seen in any protocol,
          # concat that country's keys across all 4 protocols. So
          # subs/DE.txt has DE keys from vless+vmess+trojan+ss.
          #
          # The wipe glob MUST stay as wide as the match glob below. It used to
          # be [A-Z][A-Z].txt while the matcher accepted ??.txt, so any code
          # containing a digit (T1 — MaxMind's Tor/anonymous-proxy bucket) was
          # appended to on every run and never truncated. subs/T1.txt reached
          # 2042 lines holding 2 distinct servers before this was caught.
          rm -f subs/??.txt 2>/dev/null || true
          for proto in vless vmess trojan ss; do
            for f in subs/$proto/*.txt; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                ??.txt)
                  cc=$(basename "$base" .txt)
                  cat "$f" >> "subs/${cc}.txt"
                  ;;
              esac
            done
          done

          # Belt-and-braces: drop exact-duplicate URIs AND same-endpoint configs
          # that survived per-protocol selection. The per-protocol selector
          # already dedups within a protocol, but the union above concatenates
          # four files, so one host reached over both trojan and ss lands twice.
          #
          # Uses the vlessfilter binary (built above for regen-readme) so this
          # shares selector.EndpointKey with the selector itself — notably its
          # vmess base64 decoding. Doing it in awk would need gawk's 3-arg
          # match(); GitHub runners default to mawk, where that silently fails.
          # Includes the per-protocol files, not just the top-level union. The
          # union was deduped while subs/trojan/all.txt still shipped 51 lines
          # covering 36 endpoints, so anyone subscribing to a single protocol
          # URL got the duplicates the top-level URL had already removed.
          /tmp/vlessfilter dedup-endpoints \
            subs/all.txt subs/rotating.txt subs/??.txt \
            subs/*/all.txt subs/*/rotating.txt subs/*/??.txt

          # Regenerate top-level all-results.csv as the UNION of every
          # protocol's results.
          #
          # This used to `break` after the first artifact it found, so
          # all-results.csv held vless rows only and the vmess/trojan/ss
          # measurements were discarded on every run — which also starved
          # verify-russia.yml, since it draws candidates from this file.
          : > /tmp/results-merged.csv
          wrote_header=0
          for proto in vless vmess trojan ss; do
            csv="artifacts/subs-$proto/all-results.csv"
            [ -f "$csv" ] || continue
            if [ "$wrote_header" -eq 0 ]; then
              head -1 "$csv" >> /tmp/results-merged.csv
              wrote_header=1
            fi
            tail -n +2 "$csv" >> /tmp/results-merged.csv
          done
          if [ "$wrote_header" -eq 1 ]; then
            mv /tmp/results-merged.csv all-results.csv
            echo "all-results.csv: $(( $(wc -l < all-results.csv) - 1 )) rows across all protocols"
          else
            echo "::warning::no per-protocol all-results.csv artifacts — keeping previous file"
          fi

      - name: Commit and push
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          set -e
          git config user.name "VlessFilter Bot"
          git config user.email "vf-bot@noreply.github.com"
          git add -f subs/ all-results.csv README.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "results: matrix refresh $(date -u +%Y%m%d-%H%M%S)" || exit 0
          # Pull --rebase to handle the case where humans pushed
          # to main while our matrix jobs were running. Stash any
          # other local changes first to avoid conflict.
          git fetch origin main
          git rebase origin/main || {
            echo "rebase failed (likely conflict in subs/) — taking ours"
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            # Re-apply our generated outputs
            git add -f subs/ all-results.csv README.md 2>/dev/null || true
            git commit -m "results: matrix refresh $(date -u +%Y%m%d-%H%M%S) (forced)" --allow-empty
          }
          if [ -n "$PUSH_TOKEN" ]; then
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          else
            git push origin HEAD:main
          fi
