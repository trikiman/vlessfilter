# VlessFilter sources — list of subscription URLs to pull VLESS keys from.
# Edit this file to add/remove sources.
#
# Confirmed reach (May 2026): >70k unique VLESS configs across the sources
# below. Largest single contributor is sevcator/5ubscrpt10n with 36
# enumerated mini-sub files plus the protocol-only vl.txt file.

# Country codes for country-template sources. Empty list = use the built-in
# default of ~107 ISO codes that v2go is known to publish files for.
countries: []

sources:
  # === Country-split aggregators (templated, 1 URL → N files) ===

  # v2go's per-country output, refreshed every 6 hours upstream.
  # Provides ~50-2000 vless configs per country file.
  - name: v2go-country
    url: https://raw.githubusercontent.com/Danialsamadi/v2go/main/Splitted-By-Country/{CC}.txt
    kind: country-template
    enabled: true

  # === Range-templated aggregators (1 entry expands to N URLs) ===

  # sevcator/5ubscrpt10n mini-sub files — 36 numbered subscription
  # archives, each ~1-3MB, totaling ~30k+ unique vless after dedup.
  # Many files are base64-encoded (xray-knife auto-detects format).
  - name: sevcator-mini
    url: https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/mini/m1n1-5ub-{N}.txt
    kind: range-template
    from: 1
    to: 36
    enabled: true

  # === Bulk per-protocol aggregators (single URL each) ===

  # sevcator's protocol-only vless dump — 25,706 plain vless lines.
  # Largest single-file vless source we've found.
  - name: sevcator-vl
    url: https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/protocols/vl.txt
    kind: plain
    enabled: true

  # ebrasha — 22,540 plain vless lines, refreshed daily.
  - name: ebrasha-vless
    url: https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/vless_configs.txt
    kind: plain
    enabled: true

  # v2go's protocol-only output (vless across all countries).
  # Base64-encoded, ~6,100 vless lines.
  - name: v2go-vless
    url: https://raw.githubusercontent.com/Danialsamadi/v2go/main/Splitted-By-Protocol/vless.txt
    kind: plain
    enabled: true

  # nscl5/4 — Telegram-channel scraper, ~5,800 plain vless in the all-sub.
  - name: nscl5-allsub
    url: https://raw.githubusercontent.com/nscl5/4/main/All_Configs_Sub.txt
    kind: plain
    enabled: true

  # nscl5/4 protocol-only (some overlap with allsub but base64 catches more).
  - name: nscl5-vless
    url: https://raw.githubusercontent.com/nscl5/4/main/Splitted-By-Protocol/vless.txt
    kind: plain
    enabled: true

  # Epodonios — multi-protocol all-in-one, ~2,800 vless after filter.
  - name: epodonios-allsub
    url: https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt
    kind: plain
    enabled: true

  # ndsphonemy — speed-tested subset, smaller but historically high quality.
  - name: ndsphonemy-default
    url: https://raw.githubusercontent.com/ndsphonemy/proxy-sub/main/default.txt
    kind: plain
    enabled: true

  - name: ndsphonemy-speed
    url: https://raw.githubusercontent.com/ndsphonemy/proxy-sub/main/speed.txt
    kind: plain
    enabled: true

  # kort0881/vpn-aggregator — EU-focused aggregator, 26,576 plain vless.
  # Largest "single file" vless source after sevcator/protocols/vl.txt.
  - name: kort-vless
    url: https://raw.githubusercontent.com/kort0881/vpn-aggregator/main/out/by_type/vless.txt
    kind: plain
    enabled: true

  # cybersecplayground/V2Hive — multi-protocol aggregator, ~12k vless.
  - name: v2hive-vless
    url: https://raw.githubusercontent.com/cybersecplayground/V2Hive/main/by-protocol/all_vless.txt
    kind: plain
    enabled: true

  # ninjastrikers/nexus-nodes — recently updated multi-protocol aggregator.
  - name: ninjastrikers-all
    url: https://raw.githubusercontent.com/ninjastrikers/nexus-nodes/main/configs/all.txt
    kind: plain
    enabled: true

  # YawStar/Proxy-Hunter — Telegram + base64 + SSCONF aggregator (small).
  - name: yawstar-all
    url: https://raw.githubusercontent.com/YawStar/Proxy-Hunter/main/configs/proxy_configs.txt
    kind: plain
    enabled: true
