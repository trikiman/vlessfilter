# VlessFilter sources — list of subscription URLs to pull VLESS keys from.
# Edit this file to add/remove sources.
#
# Confirmed reach (May 2026): >70k unique VLESS configs across the sources
# below. Largest single contributor is sevcator/5ubscrpt10n with 36
# enumerated mini-sub files plus the protocol-only vl.txt file.

# Country codes for country-template sources. Empty list = use the built-in
# default of ~107 ISO codes that v2go is known to publish files for.
countries: []

sources:
  # === Country-split aggregators (templated, 1 URL → N files) ===

  # v2go's per-country output, refreshed every 6 hours upstream.
  # Provides ~50-2000 vless configs per country file.
  - name: v2go-country
    url: https://raw.githubusercontent.com/Danialsamadi/v2go/main/Splitted-By-Country/{CC}.txt
    kind: country-template
    enabled: true

  # === Range-templated aggregators (1 entry expands to N URLs) ===

  # sevcator/5ubscrpt10n mini-sub files — 36 numbered subscription
  # archives, each ~1-3MB, totaling ~30k+ unique vless after dedup.
  # Many files are base64-encoded (xray-knife auto-detects format).
  - name: sevcator-mini
    url: https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/mini/m1n1-5ub-{N}.txt
    kind: range-template
    from: 1
    to: 36
    enabled: true

  # AvenCores/goida-vpn-configs — meta-mirror that pulls from 26 different
  # upstream aggregators (sakha1370, sevcator, yitong2333, acymz,
  # miladtahanian, roosterkid, Epodonios, CidVpn, mheidari98, MahsaNet,
  # LalatinaHub/Mineral, Pawdroid, MhdiTaheri, free18, Argh94, shabane,
  # wuqb2i4f, igareck, Mr-Meshky, V2RayRoot, etc.) and republishes them as
  # githubmirror/<N>.txt every 9 minutes via GitHub Actions.
  #
  # Author recommends 1, 6, 22, 23, 24, 25 as highest quality; all 26 added
  # since xray-knife dedupes overlapping configs at the UNIQUE constraint
  # level, so coverage of new aggregators we don't have direct entries for
  # comes for free with no additional cost.
  - name: goida-vpn-configs
    url: https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/main/githubmirror/{N}.txt
    kind: range-template
    from: 1
    to: 26
    enabled: true

  # === Telegram-channel scrapers (bulk vless, lots of fresh keys) ===

  # yaney01/telegram-collector — Python script that scrapes vless/vmess/
  # trojan/ss/reality/hysteria/tuic/juicity from many Telegram channels.
  # splitted/mixed is the biggest aggregate (3500+ vless, base64-encoded).
  # subscribe/protocols/vless adds ~2500 unique. networks/ws hits ws-only.
  - name: yaney01-mixed
    url: https://raw.githubusercontent.com/yaney01/telegram-collector/main/splitted/mixed
    kind: plain
    enabled: true

  - name: yaney01-protocols-vless
    url: https://raw.githubusercontent.com/yaney01/telegram-collector/main/subscribe/protocols/vless
    kind: plain
    enabled: true

  - name: yaney01-networks-ws
    url: https://raw.githubusercontent.com/yaney01/telegram-collector/main/networks/ws
    kind: plain
    enabled: true

